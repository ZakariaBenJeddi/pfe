<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 5 Stepper</title>
  <!-- Liens vers Bootstrap et autres ressources -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <style>
    /* Styles personnalisés pour le stepper */
    .stepper { height: 800px; }
    .steps-container { display: flex; flex-direction: row; }
    .steps { display: flex; justify-content: space-between; }
    .step { padding: 10px; cursor: pointer; }
    .step .step-title { display: flex; align-items: center; }
    .step .step-number { font-weight: bold; margin-right: 10px; }
    .stepper-content-container { display: flex; flex-direction: column; }
    .stepper-content { display: none; padding: 20px; border-top: 1px solid #ccc; }
    .stepper-content.active { display: block; }
  </style>
</head>
<body>

<!-- Stepper Horizontal -->
<div class="stepper" id="stepper-horizontal">
  <div class="steps-container">
    <div class="steps">
      <div class="step" id="step1">
        <div class="step-title">
          <span class="step-number">01</span>
          <div class="step-text">Informations de base</div>
        </div>
      </div>
      <div class="step" id="step2">
        <div class="step-title">
          <span class="step-number">02</span>
          <div class="step-text">Données personnelles</div>
        </div>
      </div>
      <div class="step" id="step3">
        <div class="step-title">
          <span class="step-number">03</span>
          <div class="step-text">Conditions générales</div>
        </div>
      </div>
      <div class="step" id="step4">
        <div class="step-title">
          <span class="step-number">04</span>
          <div class="step-text">Terminer</div>
        </div>
      </div>
    </div>
  </div>
  <div class="stepper-content-container">
    <div class="stepper-content active" id="content1">
      <div>Étape 1</div>
    </div>
    <div class="stepper-content" id="content2">
      <div>Étape 2</div>
    </div>
    <div class="stepper-content" id="content3">
      <div>Étape 3</div>
    </div>
    <div class="stepper-content" id="content4">
      <div>Étape 4</div>
    </div>
  </div>
</div>

<!-- Stepper Vertical -->
<div class="stepper" id="stepper-vertical">
  <div class="steps-container">
    <div class="steps">
      <div class="step" id="step1-vert">
        <div class="step-title">
          <span class="step-number">01</span>
          <div class="step-text">Informations de base</div>
        </div>
      </div>
      <div class="step" id="step2-vert">
        <div class="step-title">
          <span class="step-number">02</span>
          <div class="step-text">Données personnelles</div>
        </div>
      </div>
      <div class="step" id="step3-vert">
        <div class="step-title">
          <span class="step-number">03</span>
          <div class="step-text">Conditions générales</div>
        </div>
      </div>
      <div class="step" id="step4-vert">
        <div class="step-title">
          <span class="step-number">04</span>
          <div class="step-text">Terminer</div>
        </div>
      </div>
    </div>
  </div>
  <div class="stepper-content-container">
    <div class="stepper-content active" id="content1-vert">
      <div>Étape 1</div>
    </div>
    <div class="stepper-content" id="content2-vert">
      <div>Étape 2</div>
    </div>
    <div class="stepper-content" id="content3-vert">
      <div>Étape 3</div>
    </div>
    <div class="stepper-content" id="content4-vert">
      <div>Étape 4</div>
    </div>
  </div>
</div>

<!-- Stepper sans icônes ni en-têtes -->
<div class="stepper" id="stepper-simple">
  <div class="steps-container">
    <div class="steps">
      <div class="step" id="step1-simple"></div>
      <div class="step" id="step2-simple"></div>
      <div class="step" id="step3-simple"></div>
      <div class="step" id="step4-simple"></div>
    </div>
  </div>
  <div class="stepper-content-container">
    <div class="stepper-content active" id="content1-simple">
      <div>Étape 1</div>
    </div>
    <div class="stepper-content" id="content2-simple">
      <div>Étape 2</div>
    </div>
    <div class="stepper-content" id="content3-simple">
      <div>Étape 3</div>
    </div>
    <div class="stepper-content" id="content4-simple">
      <div>Étape 4</div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Code JavaScript pour activer le stepper
  document.querySelectorAll('.step').forEach(step => {
    step.addEventListener('click', function() {
      const targetId = this.id.replace('step', 'content');
      document.querySelectorAll('.stepper-content').forEach(content => {
        content.classList.remove('active');
      });
      document.getElementById(targetId).classList.add('active');
    });
  });
</script>
</body>
</html>
