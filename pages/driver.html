<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver.js Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css">
    <style>
        .code-container {
            padding: 20px;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .line {
            font-family: monospace;
            margin: 5px 0;
        }
        #startTourButton {
            margin: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="tour-example">
        <h1>Exemple de Tour Guidé</h1>
        <p>Cette section sera la première étape du tour.</p>
    </div>
    <div id="tour-example2">
        <h1>Exemple de Tour Guidé</h1>
        <p>Cette section sera la première étape du tour.</p>
    </div>

    <div class="code-container">
        <div class="line">import { driver } from "driver.js";</div>
        <div class="line">import "driver.js/dist/driver.css";</div>
        <div class="line"></div>
        <div class="line">const driverObj = driver({});</div>
        <div class="line">driverObj.drive();</div>
    </div>

    <button id="startTourButton">Démarrer le Tour</button>

    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
    <script>
        document.getElementById('startTourButton').addEventListener('click', function() {
            const driverObj = window.driver.js.driver({
                showProgress: true,
                showButtons: ['next', 'previous'],
                steps: [
                    { 
                        element: '#tour-example', 
                        popover: { 
                            title: 'Premier exemple', 
                            description: 'Voici la première étape du tour',
                            side: "left", 
                            align: 'start' 
                        }
                    },
                    { 
                        element: '#tour-example2', 
                        popover: { 
                            title: 'Premier exemple', 
                            description: 'Voici la première étape du tour',
                            side: "left", 
                            align: 'start' 
                        }
                    },
                    { 
                        element: '#code-container', 
                        popover: { 
                            title: 'Import de la librairie', 
                            description: 'Première ligne de code',
                            side: "bottom", 
                            align: 'start' 
                        }
                    },
                    // ... autres étapes ...
                ]
            });

            driverObj.drive();
        });
    </script>
</body>
</html>
